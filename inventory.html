<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A1A1A">
    <meta name="description" content="STPL - Service Tyre Private Limited Complaint Management System">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="STPL CMS">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <title>Inventory Management - STPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #FFFFFF;
            --secondary-bg: #F5F5F5;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent-color: #1A1A1A;
            --accent-hover: #333333;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: rgba(0, 0, 0, 0.1);
            --success: #10B981;
            --warning: #F59E0B;
            --error: #DC2626;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: url('Gemini_Generated_Image_5sr3gj5sr3gj5sr3.png') repeat-y left center;
            background-size: 150px auto;
            background-color: #FFFFFF;
        }

        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 1.5rem;
            background: transparent;
            
            border-bottom: 1px solid var(--border-color);
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo { width: 65px;
            height: 65px; }
        
        .brand-logo img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .logo-text { text-align: center; }

        .logo-text h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--text-primary);
        }

        .logo-text p {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .button-container {
            max-width: 720px;
            margin: 0.5rem auto 0;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
        }

        .action-btn:hover { 
            color: var(--accent-color); 
            border-color: var(--accent-color);
            background: rgba(26, 26, 26, 0.05);
        }

        .action-btn svg { width: 16px; height: 16px; }

        .form-section {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 1rem 1rem 2rem;
        }

        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            max-width: 320px;
            width: 92%;
            margin: 0 auto;
            width: 92%;
            margin: 0 auto;
            width: 100%;
            box-shadow: 0 25px 80px var(--shadow);
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .card-subtitle {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
            margin: 1rem 0;
        }

        .form-group {
            margin-bottom: 0.75rem;
        }

        .form-label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
            letter-spacing: 0.5px;
        }

        .required { color: var(--error); }

        .form-input,
        .form-select {
            width: 100%;
            padding: 0.7rem 0.85rem;
            background: rgba(245, 245, 245, 0.8);
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
            background: #FFFFFF;
        }

        .form-input::placeholder { color: var(--text-muted); }

        .form-select {
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23666666' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 2rem;
        }

        .video-upload-card {
            background: rgba(245, 245, 245, 0.5);
            border: 1.5px dashed var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            text-align: center;
            transition: all 0.25s ease;
        }

        .video-upload-card:hover {
            border-color: var(--accent-color);
        }

        .video-upload-card.has-video {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 0.25rem;
            opacity: 0.8;
        }

        .upload-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .upload-label {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #FFFFFF;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 26, 26, 0.3);
        }

        #videoInput { display: none; }

        #uploadedFileName {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--success);
            font-weight: 600;
        }

        .video-preview-container {
            margin-top: 0.5rem;
            display: none;
        }

        .video-preview-container.active { display: block; }

        .video-preview-container video {
            width: 100%;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
        }

        .msg {
            padding: 0.65rem;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
            display: none;
        }

        .msg.active { display: block; }

        .msg.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .msg.error {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: var(--error);
        }

        .btn-submit {
            width: 100%;
            padding: 0.65rem;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            border: none;
            border-radius: 10px;
            color: #FFFFFF;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(26, 26, 26, 0.2);
            text-transform: uppercase;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(26, 26, 26, 0.3);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .modal-box h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 0.75rem;
            color: var(--accent-color);
        }

        .close-modal {
            position: absolute;
            top: 1rem; right: 1rem;
            background: rgba(26, 26, 26, 0.1);
            border: 1px solid rgba(26, 26, 26, 0.2);
            color: var(--text-primary);
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-modal:hover {
            background: rgba(26, 26, 26, 0.2);
            transform: rotate(90deg);
        }

        #cameraPreview, #recordedPreview {
            width: 100%;
            border-radius: 10px;
            background: #000;
            max-height: 280px;
        }

        #recordedPreview { display: none; }

        .recording-badge {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 8px;
            padding: 0.4rem 0.75rem;
            margin: 0.5rem 0;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--error);
        }

        .recording-badge.active { display: flex; }

        .recording-badge .dot {
            width: 8px; height: 8px;
            background: var(--error);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-modal {
            flex: 1;
            min-width: 100px;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-modal.primary {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #FFFFFF;
        }

        .btn-modal.primary:hover {
            box-shadow: 0 4px 15px rgba(26, 26, 26, 0.3);
        }

        .btn-modal.secondary {
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-modal.secondary:hover {
            border-color: var(--accent-color);
        }

        footer {
            background: transparent;
            
            padding: 1rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        @media (max-width: 480px) {
            header { padding: 0.75rem; }
            .brand-logo { width: 65px;
            height: 65px; }
            .logo-text h1 { font-size: 1.3rem; letter-spacing: 2px; }
            .logo-text p { font-size: 0.6rem; letter-spacing: 1px; }
            .bg-pattern {
                background-size: 80px auto;
            }
            .form-card, .login-container, .signup-container, .dashboard-card {
                max-width: 260px !important;
                width: 88% !important;
                padding: 1rem !important;
                border-radius: 14px !important;
            }
            .form-input, .form-select, .login-btn, .signup-btn, .submit-btn, .btn-submit {
                padding: 0.6rem 0.75rem !important;
                font-size: 0.85rem !important;
            }
            .form-label {
                font-size: 0.75rem !important;
                margin-bottom: 0.25rem !important;
            }
            .form-group {
                margin-bottom: 0.6rem !important;
            }
            .card-title, .login-title, .signup-title, .dashboard-title {
                font-size: 1.1rem !important;
            }
            .card-subtitle, .login-subtitle, .signup-subtitle, .dashboard-subtitle {
                font-size: 0.75rem !important;
            }
            .action-btn, .back-btn, .logout-btn, .nav-btn {
                padding: 0.5rem 0.75rem !important;
                font-size: 0.8rem !important;
            }
            .nav-btn-title {
                font-size: 0.8rem !important;
            }
            .nav-btn-subtitle {
                font-size: 0.7rem !important;
            }
            .divider {
                margin: 0.75rem 0 !important;
            }
            .video-upload-wrapper, .video-upload-card {
                padding: 0.75rem !important;
            }
            .upload-icon, .video-icon {
                font-size: 1.5rem !important;
            }
            .upload-text, .video-upload-wrapper p {
                font-size: 0.75rem !important;
            }
            .upload-label, .btn-video {
                padding: 0.4rem 0.75rem !important;
                font-size: 0.75rem !important;
            }
            footer {
                padding: 0.75rem !important;
            }
            footer p {
                font-size: 0.7rem !important;
            }
        }

        @media (max-width: 768px) {
            .bg-pattern {
                background-size: 120px auto;
            }
            .form-card, .login-container, .signup-container, .dashboard-card {
                max-width: 300px;
                width: 90%;
            }
        }
        }
        }
    </style>

<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <header>
            <div class="header-inner">
                <div class="brand-logo">
                    <img src="logo.png" alt="STPL Logo">
                </div>
                <div class="logo-text">
                    <h1>STPL</h1>
                    <p>Service Tyre Private Limited</p>
                </div>
            </div>
        </header>

        <div class="button-container">
            <a href="Administration.html" class="action-btn" id="backBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                Back
            </a>
            <a href="inventory_export.html" class="action-btn" id="exportBtn">
                Export
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </a>
        </div>

        <section class="form-section">
            <div class="form-card">
                <div class="card-header">
                    <h2 class="card-title">Inventory Entry</h2>
                    <p class="card-subtitle">Add New Item Record</p>
                </div>

                <div class="msg success" id="successMsg"></div>
                <div class="msg error" id="errorMsg"></div>

                <div class="divider"></div>

                <div class="form-group">
                    <label class="form-label">Reference No <span class="required">*</span></label>
                    <input type="text" id="refNo" class="form-input" placeholder="Enter reference number">
                </div>

                <div class="form-group">
                    <label class="form-label">Item Name <span class="required">*</span></label>
                    <input type="text" id="itemName" class="form-input" placeholder="Enter item name">
                </div>

                <div class="form-group">
                    <label class="form-label">Quantity <span class="required">*</span></label>
                    <input type="number" id="quantity" class="form-input" placeholder="Enter quantity">
                </div>

                <div class="form-group">
                    <label class="form-label">Location <span class="required">*</span></label>
                    <input type="text" id="location" class="form-input" placeholder="Enter storage location">
                </div>

                <div class="form-group">
                    <label class="form-label">Installation Date <span class="required">*</span></label>
                    <input type="date" id="installDate" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Expiry Date</label>
                    <input type="date" id="expiryDate" class="form-input">
                </div>

                <div class="divider"></div>

                <div class="video-upload-card" id="videoWrapper">
                    <div class="upload-icon">🎥</div>
                    <p class="upload-text">Capture installation video</p>
                    <button type="button" class="upload-label" onclick="openCamera()">
                        Open Camera
                    </a>
                    <span id="uploadedFileName"></span>
                    <div class="video-preview-container" id="videoPreviewContainer">
                        <video id="attachedVideo" controls playsinline></video>
                    </div>
                </div>

                <button class="btn-submit" id="submitBtn" onclick="submitInventory()">
                    Save Inventory
                </a>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 STPL - Service Tyre Private Limited</p>
        </footer>
    </div>

    <div class="modal-overlay" id="cameraModal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeCamera()">&times;</button>
            <h3>Record Video</h3>
            <video id="cameraPreview" autoplay playsinline muted></video>
            <video id="recordedPreview" controls playsinline></video>
            <div class="recording-badge" id="recBadge"><span class="dot"></span> RECORDING</div>
            <div class="modal-actions" id="modalActions">
                <button class="btn-modal primary" id="startRecBtn" onclick="startRecording()">Start Recording</button>
                <button class="btn-modal secondary" onclick="closeCamera()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        (function(){
            const loggedInUser = localStorage.getItem('loggedInUser') || 'Admin';

            let mediaStream = null;
            let mediaRecorder = null;
            let recordedChunks = [];
            let recordedBlob = null;
            let recordedVideoUrl = null;

            const refNoInput = document.getElementById('refNo');
            const itemNameInput = document.getElementById('itemName');
            const quantityInput = document.getElementById('quantity');
            const locationInput = document.getElementById('location');
            const installDateInput = document.getElementById('installDate');
            const expiryDateInput = document.getElementById('expiryDate');
            const videoWrapper = document.getElementById('videoWrapper');
            const uploadedFileName = document.getElementById('uploadedFileName');
            const videoPreviewContainer = document.getElementById('videoPreviewContainer');
            const attachedVideo = document.getElementById('attachedVideo');

            async function openCamera() {
                try {
                    recordedChunks = [];
                    recordedBlob = null;
                    if (recordedVideoUrl) {
                        URL.revokeObjectURL(recordedVideoUrl);
                        recordedVideoUrl = null;
                    }

                    mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' }, 
                        audio: true 
                    });
                    
                    const cameraPreview = document.getElementById('cameraPreview');
                    const recordedPreview = document.getElementById('recordedPreview');
                    
                    cameraPreview.srcObject = mediaStream;
                    cameraPreview.style.display = 'block';
                    recordedPreview.style.display = 'none';
                    
                    document.getElementById('cameraModal').classList.add('active');
                    document.getElementById('recBadge').classList.remove('active');
                    resetModalBtns('idle');
                } catch(e) {
                    showError('Camera access denied. Please allow camera permission and try again.');
                }
            }

            function closeCamera() {
                stopStream();
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                document.getElementById('cameraModal').classList.remove('active');
                document.getElementById('recBadge').classList.remove('active');
            }

            function stopStream() {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                    mediaStream = null;
                }
            }

            function startRecording() {
                recordedChunks = [];
                recordedBlob = null;
                
                const mimeType = getSupportedMimeType();
                
                try {
                    mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
                    
                    mediaRecorder.ondataavailable = function(e) {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = handleRecordingStop;
                    
                    mediaRecorder.start(100);
                    
                    document.getElementById('recBadge').classList.add('active');
                    resetModalBtns('recording');
                } catch(e) {
                    showError('Could not start recording. Please try again.');
                }
            }

            function stopRecording() {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                document.getElementById('recBadge').classList.remove('active');
                resetModalBtns('stopped');
            }

            function handleRecordingStop() {
                const mimeType = getSupportedMimeType();
                recordedBlob = new Blob(recordedChunks, { type: mimeType });
                recordedVideoUrl = URL.createObjectURL(recordedBlob);
                
                const recordedPreview = document.getElementById('recordedPreview');
                recordedPreview.src = recordedVideoUrl;
                recordedPreview.style.display = 'block';
                document.getElementById('cameraPreview').style.display = 'none';
                
                resetModalBtns('preview');
            }

            function saveRecording() {
                if (!recordedBlob) {
                    showError('No video recorded. Please record first.');
                    return;
                }
                
                const ext = getSupportedMimeType().includes('mp4') ? 'mp4' : 'webm';
                const fileName = 'recorded_video.' + ext;
                
                uploadedFileName.textContent = 'Video attached: ' + fileName;
                videoWrapper.classList.add('has-video');
                
                attachedVideo.src = recordedVideoUrl;
                videoPreviewContainer.classList.add('active');
                
                closeCamera();
            }

            function reRecord() {
                document.getElementById('recordedPreview').style.display = 'none';
                document.getElementById('cameraPreview').style.display = 'block';
                document.getElementById('recBadge').classList.remove('active');
                
                recordedChunks = [];
                recordedBlob = null;
                if (recordedVideoUrl) {
                    URL.revokeObjectURL(recordedVideoUrl);
                    recordedVideoUrl = null;
                }
                
                if (!mediaStream || !mediaStream.active) {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: true })
                        .then(s => {
                            mediaStream = s;
                            document.getElementById('cameraPreview').srcObject = s;
                        })
                        .catch(e => console.error('Camera restart error:', e));
                }
                resetModalBtns('idle');
            }

            function getSupportedMimeType() {
                const types = [
                    'video/webm;codecs=vp9,opus',
                    'video/webm;codecs=vp8,opus',
                    'video/webm;codecs=h264,opus',
                    'video/mp4;codecs=h264,aac',
                    'video/webm'
                ];
                for (const t of types) {
                    if (MediaRecorder.isTypeSupported(t)) return t;
                }
                return 'video/webm';
            }

            function resetModalBtns(state) {
                const c = document.getElementById('modalActions');
                if (state === 'idle') {
                    c.innerHTML = `<button class="btn-modal primary" onclick="startRecording()">Start Recording</button>
                                   <button class="btn-modal secondary" onclick="closeCamera()">Cancel</button>`;
                } else if (state === 'recording') {
                    c.innerHTML = `<button class="btn-modal primary" style="background:linear-gradient(135deg,#10B981,#059669)" onclick="stopRecording()">Stop Recording</button>`;
                } else if (state === 'stopped' || state === 'preview') {
                    c.innerHTML = `<button class="btn-modal primary" onclick="saveRecording()">Save Video</button>
                                   <button class="btn-modal secondary" onclick="reRecord()">Re-record</button>
                                   <button class="btn-modal secondary" onclick="closeCamera()">Cancel</button>`;
                }
            }

            function showError(msg) {
                const el = document.getElementById('errorMsg');
                el.textContent = msg;
                el.classList.add('active');
                document.getElementById('successMsg').classList.remove('active');
                setTimeout(() => el.classList.remove('active'), 4500);
            }

            function showSuccess(msg) {
                const el = document.getElementById('successMsg');
                el.textContent = msg;
                el.classList.add('active');
                document.getElementById('errorMsg').classList.remove('active');
            }

            function submitInventory() {
                const refNo = refNoInput.value.trim();
                const itemName = itemNameInput.value.trim();
                const quantity = quantityInput.value;
                const location = locationInput.value.trim();
                const installDate = installDateInput.value;
                const expiryDate = expiryDateInput.value;

                if (!refNo) { showError('Reference No is required.'); refNoInput.focus(); return; }
                if (!itemName) { showError('Item Name is required.'); itemNameInput.focus(); return; }
                if (!quantity) { showError('Quantity is required.'); quantityInput.focus(); return; }
                if (!location) { showError('Location is required.'); locationInput.focus(); return; }
                if (!installDate) { showError('Installation Date is required.'); installDateInput.focus(); return; }

                if (recordedBlob) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const videoBase64 = e.target.result;
                        saveRecord(refNo, itemName, quantity, location, installDate, expiryDate, videoBase64);
                    };
                    reader.onerror = function() {
                        showError('Error processing video. Please try again.');
                    };
                    reader.readAsDataURL(recordedBlob);
                } else {
                    saveRecord(refNo, itemName, quantity, location, installDate, expiryDate, null);
                }
            }

            function saveRecord(refNo, itemName, quantity, location, installDate, expiryDate, videoBase64) {
                const record = {
                    refNo: refNo,
                    itemName: itemName,
                    quantity: quantity,
                    location: location,
                    installDate: installDate,
                    expiryDate: expiryDate || '',
                    video: videoBase64,
                    time: new Date().toISOString(),
                    user: loggedInUser
                };

                const existingRecords = JSON.parse(localStorage.getItem('inventoryRecords') || '[]');
                existingRecords.push(record);
                localStorage.setItem('inventoryRecords', JSON.stringify(existingRecords));

                showSuccess('Inventory saved successfully');
                resetForm();
            }

            function resetForm() {
                refNoInput.value = '';
                itemNameInput.value = '';
                quantityInput.value = '';
                locationInput.value = '';
                installDateInput.value = '';
                expiryDateInput.value = '';
                
                uploadedFileName.textContent = '';
                videoWrapper.classList.remove('has-video');
                videoPreviewContainer.classList.remove('active');
                
                recordedChunks = [];
                recordedBlob = null;
                if (recordedVideoUrl) {
                    URL.revokeObjectURL(recordedVideoUrl);
                    recordedVideoUrl = null;
                }
            }

            window.openCamera = openCamera;
            window.closeCamera = closeCamera;
            window.startRecording = startRecording;
            window.stopRecording = stopRecording;
            window.saveRecording = saveRecording;
            window.reRecord = reRecord;
            window.submitInventory = submitInventory;
        })();
    </script>
</body>
</html>
